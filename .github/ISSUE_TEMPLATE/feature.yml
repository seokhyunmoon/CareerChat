name: "Feature"
description: "새로운 기능 개발 작업"
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      placeholder: 이 작업의 목적을 작성하세요.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 해야 할 일
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: input
    id: assignee
    attributes:
      label: 담당자
      placeholder: 예) 문석현
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      placeholder: 관련 링크나 문서를 작성하세요.
