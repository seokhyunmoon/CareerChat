name: "Refactor"
description: "코드 구조 개선 작업"
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      placeholder: 어떤 구조를 왜 개선하려는지 작성하세요.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 해야 할 일
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: input
    id: assignee
    attributes:
      label: 담당자
      placeholder: 예) 문석현
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      placeholder: 관련 코드, 문서, 참고 링크를 작성하세요.
