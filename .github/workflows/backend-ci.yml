name: Backend CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careerchat
          POSTGRES_USER: careerchat
          POSTGRES_PASSWORD: careerchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerchat -d careerchat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend tests
        run: ./gradlew test
