[project]
name = "careerchat-ai"
version = "0.1.0"
description = "CareerChat AI analysis pipeline"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-text-splitters",
    "sentence-transformers",
    "faiss-cpu",
    "pydantic",
    "python-dotenv",
    "qdrant-client>=1.18.0",
    "pydantic-settings>=2.14.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
