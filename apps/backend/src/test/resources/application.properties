#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careerchat}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careerchat_test}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:careerchat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:careerchat}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=false

careerchat.jwt.secret=${JWT_SECRET:careerchat-local-development-jwt-secret-key-must-be-at-least-32-bytes}
careerchat.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
careerchat.ai.callback-token=${AI_CALLBACK_TOKEN:careerchat-local-ai-callback-token}
careerchat.ai.backend-base-url=${AI_BACKEND_BASE_URL:http://localhost:8000}
careerchat.ai.callback-base-url=${AI_CALLBACK_BASE_URL:http://localhost:8080}
careerchat.ai.request-timeout=${AI_REQUEST_TIMEOUT:10s}
